# LaunchDarkly evals: evaluates AI Config variations against stored datasets
# with evals/ci_eval.py, and reports in the job summary and on PRs. The evals
# job fails, and so blocks the merge when it's a required check, when a result
# fails the gate set in evals/ci_targets.toml. See evals/CI_EVALS.md.
#
# It runs on every PR so the required check always reports. A PR that changes
# none of the files listed in the "Check for eval changes" step passes without
# running the evals. Pull requests from forks skip the job, which also passes.
#
# PRs and pushes to main use the quick datasets; the nightly run uses the full
# ones. Every run on main keeps its results as the eval-results-quick or
# eval-results-full artifact, and every run compares with the latest one from
# main for the same datasets.
name: LaunchDarkly evals

on:
  # No paths filter: a required check from a workflow that doesn't run stays
  # pending and blocks the PR. The "Check for eval changes" step filters instead.
  pull_request:
  push:
    branches: [main]
    paths:
      - app/backend/src/agents/**
      - infrastructure/launchdarkly/ai_configs_resources.tf
      - infrastructure/launchdarkly/model_configs.tf
      - evals/ci_eval.py
      - evals/ci_targets.toml
      - evals/pyproject.toml
      - evals/uv.lock
      - .github/workflows/evals.yml
  schedule:
    - cron: "0 9 * * *"  # nightly full run, 09:00 UTC
  workflow_dispatch:
    inputs:
      config:
        description: AI Config key to evaluate (blank for every target in ci_targets.toml)
        default: ""
      variation:
        description: Variation key (blank for the variation each config serves)
        default: ""
      full:
        description: Use the full datasets instead of the quick ones
        type: boolean
        default: false

concurrency:
  # Per event too, so a push to main doesn't cancel the nightly run.
  group: evals-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  evals:
    # Pull requests from forks don't get secrets or an AWS token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write       # AWS sign-in through OIDC
      actions: read         # download the latest main results
      pull-requests: write  # PR comment
    env:
      LD_PROJECT_KEY: ${{ secrets.LD_PROJECT_KEY }}
      LD_API_TOKEN: ${{ secrets.LD_API_TOKEN }}
      LD_SDK_KEY: ${{ secrets.LD_SDK_KEY }}
      LD_API_BASE_URI: ${{ secrets.LD_API_BASE_URI }}
      LD_UI_BASE_URI: ${{ secrets.LD_UI_BASE_URI }}
      LD_BASE_URI: ${{ secrets.LD_BASE_URI }}
      LD_STREAM_URI: ${{ secrets.LD_STREAM_URI }}
      LD_EVENTS_URI: ${{ secrets.LD_EVENTS_URI }}
      # Where the run's spans go (the SDK's otel extra). Unset: LaunchDarkly production.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
      # Azure AI Foundry, for variations on an Azure model config (branch_agent's azure-foundry).
      # Unset, those variations error, since the SDK would call OpenAI instead.
      AZURE_FOUNDRY_ENDPOINT: ${{ secrets.AZURE_FOUNDRY_ENDPOINT }}
      AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
      # Gemini API, for variations on the Gemini model config (account_agent's gemini-4-carbon).
      # Unset, those variations error.
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      # Whose targeting decides which variation is "served".
      LD_ENVIRONMENT: ${{ secrets.LD_ENVIRONMENT }}
    steps:
      # Keep in step with the push paths above.
      - name: Check for eval changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          run=false
          while IFS= read -r f; do
            case "$f" in
              app/backend/src/agents/* | infrastructure/launchdarkly/ai_configs_resources.tf | \
              infrastructure/launchdarkly/model_configs.tf | evals/ci_eval.py | evals/ci_targets.toml | \
              evals/pyproject.toml | evals/uv.lock | .github/workflows/evals.yml)
                run=true; echo "Eval-relevant change: $f" ;;
            esac
          done <<< "$files"
          [ "$run" = false ] && echo "No eval-relevant changes; skipping the evals."
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.changes.outputs.run == 'true'

      - uses: astral-sh/setup-uv@v6
        if: steps.changes.outputs.run == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: evals/uv.lock

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.changes.outputs.run == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: policy-agent-ci-evals-${{ github.run_id }}

      - name: Install
        if: steps.changes.outputs.run == 'true'
        working-directory: evals
        run: uv sync --locked

      - name: Download the latest main results
        if: steps.changes.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p baseline results
          # Quick and full results come from different runs on main, so each
          # is the newest unexpired artifact of its name from a main run.
          for mode in quick full; do
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=eval-results-$mode&per_page=50" \
              --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")][0].id // empty')
            if [ -n "$id" ]; then
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "baseline/$mode.zip"
              unzip -o -q "baseline/$mode.zip" -d baseline && rm "baseline/$mode.zip"
            else
              echo "No $mode results from main yet"
            fi
          done

      - name: Run evals
        if: steps.changes.outputs.run == 'true'
        working-directory: evals
        env:
          CONFIG: ${{ inputs.config }}
          VARIATION: ${{ inputs.variation }}
          FULL: ${{ inputs.full }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$FULL" = true ]; then mode=full; else mode=quick; fi
          label="${PR:+pr-$PR}"
          label="${label:-${GITHUB_REF_NAME//\//-}}-${GITHUB_SHA::7}"
          flag=""; [ "$mode" = quick ] && flag=--quick
          uv run python ci_eval.py $flag ${VARIATION:+--variation "$VARIATION"} ${CONFIG:+--config "$CONFIG"} \
            --label "$label" --no-run-links --summary-file ../results/summary.md \
            --json-out "../results/results-$mode.json" --baseline "../baseline/results-$mode.json"

      - name: Write the job summary
        if: always() && hashFiles('results/summary.md') != ''
        run: cat results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        if: always() && github.event_name == 'pull_request' && hashFiles('results/summary.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- launchdarkly-ci-evals -->"
          body="$(printf '%s\n' "$marker"; cat results/summary.md)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('results/results-quick.json') != ''
        with:
          name: eval-results-quick
          path: results/results-quick.json
          retention-days: 90

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('results/results-full.json') != ''
        with:
          name: eval-results-full
          path: results/results-full.json
          retention-days: 90
