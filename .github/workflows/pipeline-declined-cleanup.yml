name: pipeline-declined-cleanup

# Closes issues that have carried `declined` for 7 days or more.
# They stay searchable; the label stays on them.

on:
  schedule:
    - cron: "17 9 * * *"   # daily, 09:17 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const DAYS = 7;
            const cutoff = Date.now() - DAYS * 24 * 60 * 60 * 1000;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', labels: 'declined', per_page: 100,
            });

            for (const issue of issues) {
              if (issue.pull_request) continue;

              // When was `declined` applied? Use the most recent labeled event for it.
              const events = await github.paginate(github.rest.issues.listEvents, {
                ...context.repo, issue_number: issue.number, per_page: 100,
              });
              const declinedAt = events
                .filter(e => e.event === 'labeled' && e.label && e.label.name === 'declined')
                .map(e => new Date(e.created_at).getTime())
                .sort((a, b) => b - a)[0];

              const since = declinedAt ?? new Date(issue.updated_at).getTime();
              if (since > cutoff) continue;

              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `Declined ${DAYS}+ days ago; closing. Reopen and remove \`declined\` to revive it.`,
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number,
                state: 'closed', state_reason: 'not_planned',
              });
              core.info(`Closed #${issue.number}`);
            }
