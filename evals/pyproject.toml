[project]
name = "policy-agent-evals"
version = "0.1.0"
description = "Offline evaluations of the ToggleBank policy agent, run from code with the LaunchDarkly AI SDK"
requires-python = ">=3.12"
dependencies = [
  "launchdarkly-ai-server==1.0.0",
  "launchdarkly-ai-openai-messages==1.0.0",
  "launchdarkly-ai-langchain-messages==1.0.0",
  "launchdarkly-ai-langchain-agents==1.0.0",
  "langchain-aws>=1.0",
  "launchdarkly-server-sdk>=9.0",
  "python-dotenv>=1.0",
  "launchdarkly-ai-python>=1.0.0",
]

[dependency-groups]
notebook = [
  "jupytext>=1.16",
  "ipykernel>=6",
  "nbclient>=0.10",
  "jupyterlab>=4",
  "matplotlib>=3.11.2",
]

[tool.uv]
package = false
