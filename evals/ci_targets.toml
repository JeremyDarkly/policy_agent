# What ci_eval.py evaluates for each AI Config.
#
# dataset / quick_dataset: keys of datasets stored in LaunchDarkly. Upload the
#   matching .jsonl file from this folder in the LaunchDarkly UI
#   (Library > Datasets > New dataset) with that key. --quick uses quick_dataset.
# scorers: names of local scorers defined in ci_eval.py (SCORERS).
# judges: keys of LaunchDarkly judge configs to run on every row.
# exclude_variations: variation keys never evaluated, even when targeting or a
#   test context serves them (for variations the eval runner can't call).
#
# --- Merge gate ----------------------------------------------------------------
# Each result (one config, variation and dataset) fails the CI check, and so
# blocks the merge, when:
#   - any row errored (the model or judge call failed),
#   - its pass rate (rows passing every scorer and judge / all rows) is below
#     min_pass_rate (default 1.0), or
#   - it passes more than max_regression_rows (default 1) fewer rows than the
#     latest result from main for the same dataset. Skipped when the dataset's
#     row count has changed since main.
# A [<config>.tools] table can set its own. The floors below were set on
# 2026-11-12 at one row under what main passed on the quick datasets then, so
# one noisy judge call doesn't fail a PR. Raise them as the agents improve.
#
# Tools: a variation is run with the Library tools it attaches that the backend
# implements (app/backend/src/tools/registry.py), backed by those
# implementations, as the backend's tool loop runs it. Attached tools the
# backend doesn't implement aren't given to the model, as in production. For a
# variation with tools, the target's [<config>.tools] table replaces its
# dataset, quick_dataset, scorers and judges, so the tool-use judge
# (ci-judge-tool-use) grades the trajectory only where there is one. Variations
# without tools keep the target's own settings.

# --- Test contexts -------------------------------------------------------------
# For each target, ci_eval.py asks LaunchDarkly (with the server SDK) which
# variation each test context below is served, and evaluates every variation
# they reach, as well as what the default rule serves. So a variation that a
# targeting rule or individual target serves is evaluated without being listed.
#
# A context chooses the variation only. Its attributes don't reach the prompt:
# prompt variables still come from each dataset row's variables.
#
# Attributes match what the app sends (app/ui/src/lib/demoUser.ts and
# app/backend/src/utils/user_profile.py). kind defaults to "user" and key to
# "ci-<name>". A target resolves every context unless it sets
# contexts = ["name", ...] (or contexts = [] for none). --no-contexts turns
# this off for one run.
#
# A context costs one SDK evaluation. Eval runs are per distinct variation, so
# a context served a variation already selected adds no model calls.

# The app's two demo logins.
[contexts.customer]
role = "customer"
user_type = "customer"
plan = "commercial"

# The customer after spending past the spend rule's threshold
# (scripts/setup_spend_rule.py), so CI also evaluates the variation that rule serves.
[contexts.customer-over-budget]
role = "customer"
user_type = "customer"
plan = "commercial"
running_spend_cents = 5.0

[contexts.employee]
role = "employee"
user_type = "internal"
plan = "internal"

# Plan tiers. No config targets on plan yet; these test a future rule on it.
[contexts.customer-bronze]
role = "customer"
user_type = "customer"
plan = "bronze"
customer_tier = "bronze"

[contexts.customer-platinum]
role = "customer"
user_type = "customer"
plan = "platinum"
customer_tier = "platinum"

[triage_agent]
dataset = "triage_routing_dataset"
quick_dataset = "triage_routing_dataset_quick"
scorers = ["routed-to-expected-specialist"]
judges = []
min_pass_rate = 0.8  # main: 12/13 quick, 48/48 full
# jev-choice routes with Jev (TypeSafe's decision model) over its own HTTP API,
# not an LLM. The AI SDK's eval runner generates through LangChain and drops
# model.custom, where the variation keeps its Jev question, so it can't run it.
# Compare it with run_triage_experiment.py --pilot instead. Excluded even when
# targeting serves it (the demo target, or a guarded rollout of the default rule).
exclude_variations = ["jev-choice"]

# The specialist and brand voice datasets are built by build_specialist_datasets.py
# into ci_datasets/. Judges read the row's variables; ground_truth is a template
# rendered with them and becomes the judge's {{ground_truth_context}}.

[account_agent]
dataset = "account_agent_dataset"
quick_dataset = "account_agent_dataset_quick"
# gemini-4-carbon (issue #79) isn't served by any rule; listing it runs it next to
# the served variation. It needs GOOGLE_API_KEY (ci_eval.py's Gemini handler).
variations = ["gemini-4-carbon"]
min_pass_rate = 0.6  # main: 3/3 quick, 8/8 full
judges = [
  { key = "ci-judge-accuracy", threshold = 0.8, ground_truth = "{{account_info}}" },
]

[branch_agent]
dataset = "branch_agent_dataset"
quick_dataset = "branch_agent_dataset_quick"
min_pass_rate = 0.6  # not run on main yet: both served variations have tools
judges = [
  { key = "ci-judge-accuracy", threshold = 0.8, ground_truth = "{{branch_info}}" },
]

# For tool-calling (find_branches). The branch details come from the tool, so the
# accuracy judge's location context isn't the ground truth any more.
[branch_agent.tools]
dataset = "branch_agent_tools_dataset"
quick_dataset = "branch_agent_tools_dataset_quick"
min_pass_rate = 0.5  # main: 3/4 and 4/4 quick, 10/10 full
judges = [
  { key = "ci-judge-tool-use", threshold = 0.8, ground_truth = "Expected tool calls (an empty list means no tool is needed): {{expected_tools}}" },
  { key = "ci-judge-coherence", threshold = 0.7 },
]

[scheduler_agent]
dataset = "scheduler_agent_dataset"
quick_dataset = "scheduler_agent_dataset_quick"
# main: 0/3 quick, 1/8 full. No floor until the accuracy failures are fixed;
# the regression check and row errors still apply.
min_pass_rate = 0.0
judges = [
  { key = "ci-judge-accuracy", threshold = 0.8, ground_truth = "Available appointment slots (offer only these):\n{{available_slots}}" },
  { key = "ci-judge-coherence", threshold = 0.7 },
]

# For tool-calling (get_available_slots). The slots come from the tool in the run,
# so the tool-use judge checks them against the trajectory, not a stored list.
[scheduler_agent.tools]
dataset = "scheduler_agent_tools_dataset"
quick_dataset = "scheduler_agent_tools_dataset_quick"
min_pass_rate = 0.25  # main: 2/4 quick, 5/10 full
judges = [
  { key = "ci-judge-tool-use", threshold = 0.8, ground_truth = "Expected tool calls (an empty list means no tool is needed): {{expected_tools}}" },
  { key = "ci-judge-coherence", threshold = 0.7 },
]

[brand_agent]
dataset = "brand_agent_dataset"
quick_dataset = "brand_agent_dataset_quick"
# The variation sets temperature and top_p, which Claude Haiku 4.5 rejects
# together. The backend's Bedrock wrapper sends only temperature, so CI does too.
drop_parameters = ["top_p", "top_k"]
min_pass_rate = 0.5  # main: 3/4 quick, 5/8 full
judges = [
  { key = "ci-judge-accuracy", threshold = 0.8, ground_truth = "The specialist's draft (every fact must be kept):\n{{specialist_response}}" },
  { key = "ci-judge-coherence", threshold = 0.7 },
]
